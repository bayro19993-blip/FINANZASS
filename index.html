<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mut:#6b7280;--ac:#0f766e;--bad:#c2410c;--ok:#15803d;--bd:#e5e7eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1012;--card:#1a1d21;--tx:#f1f3f5;--mut:#9aa3ad;--ac:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--bd:#2a2f35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1012;--card:#1a1d21;--tx:#f1f3f5;--mut:#9aa3ad;--ac:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--bd:#2a2f35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.big{font-size:32px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.mut{color:var(--mut);font-size:14px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:8px}
button{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.f{display:flex;gap:8px}.f>*{flex:1}
.d{padding:10px 0;border-bottom:1px solid var(--bd)}.d:last-child{border-bottom:0}
.d .f{margin-top:8px}.d input{margin:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:var(--bg)}
</style>
</head>
<body>
<h1>Mis Finanzas</h1>

<div class="card">
  <div class="mut">Te queda disponible</div>
  <div class="big" id="left">$0</div>
  <div class="row"><span>Salario</span><span id="s1"></span></div>
  <div class="row"><span>Deudas pendientes</span><span id="s2" class="neg"></span></div>
  <div class="row"><span>Deudas ya pagadas este mes</span><span id="s3" class="neg"></span></div>
  <div class="row"><span>Gastos</span><span id="s4" class="neg"></span></div>
  <div class="row"><span>Tras descontar solo deudas</span><span id="s5"></span></div>
</div>

<div class="tabs">
  <button data-t="sal" class="on">Salario</button>
  <button data-t="deu">Deudas</button>
  <button data-t="gas">Gastos</button>
</div>

<div id="sal">
  <div class="card"><h2>Salario del mes</h2>
    <input id="salIn" type="number" inputmode="decimal" placeholder="Ej: 2500000">
    <button onclick="saveSal()">Guardar salario</button>
  </div>
  <div class="card"><h2>Nuevo mes</h2>
    <div class="mut" style="margin-bottom:8px">Borra los gastos y el contador de pagos. Las deudas pendientes se conservan.</div>
    <button class="g" onclick="newMonth()">Empezar mes nuevo</button>
  </div>
</div>

<div id="deu" hidden>
  <div class="card"><h2>Agregar deuda</h2>
    <input id="dN" placeholder="¿A quién le debes?">
    <input id="dA" type="number" inputmode="decimal" placeholder="Cantidad">
    <button onclick="addDebt()">Agregar</button>
  </div>
  <div class="card"><h2>Pendientes</h2><div id="dL"></div></div>
</div>

<div id="gas" hidden>
  <div class="card"><h2>Agregar gasto</h2>
    <input id="gD" placeholder="Descripción">
    <select id="gC"><option>Comida</option><option>Transporte</option><option>Vivienda</option><option>Servicios</option><option>Ocio</option><option>Salud</option><option>Otro</option></select>
    <input id="gA" type="number" inputmode="decimal" placeholder="Cantidad">
    <button onclick="addExp()">Agregar</button>
  </div>
  <div class="card"><h2>Gastos del mes</h2><div id="gL"></div></div>
</div>

<script>
var KEY="misfinanzas_v1";
var S={salary:0,debts:[],expenses:[],paid:0};
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();}
var fmt=new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});
function m(n){return fmt.format(n||0);}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function $(i){return document.getElementById(i);}
function saveSal(){var v=parseFloat($("salIn").value);if(isNaN(v)||v<0)return;S.salary=v;save();}
function addDebt(){var n=$("dN").value.trim(),a=parseFloat($("dA").value);if(!n||!(a>0))return;S.debts.push({id:id(),name:n,left:a,total:a});$("dN").value="";$("dA").value="";save();}
function addExp(){var d=$("gD").value.trim(),a=parseFloat($("gA").value);if(!d||!(a>0))return;S.expenses.push({id:id(),desc:d,cat:$("gC").value,amount:a});$("gD").value="";$("gA").value="";save();}
function payDebt(i){
  var d=S.debts.find(function(x){return x.id===i;});if(!d)return;
  var inp=$("p"+i),v=inp.value===""?d.left:parseFloat(inp.value);
  if(isNaN(v)||v<=0)return;if(v>d.left)v=d.left;
  S.paid+=v;d.left-=v;
  if(d.left<=0.005)S.debts=S.debts.filter(function(x){return x.id!==i;});
  save();
}
function delDebt(i){if(confirm("¿Eliminar esta deuda sin registrar pago?")){S.debts=S.debts.filter(function(x){return x.id!==i;});save();}}
function delExp(i){S.expenses=S.expenses.filter(function(x){return x.id!==i;});save();}
function newMonth(){if(confirm("¿Borrar gastos y pagos del mes?")){S.expenses=[];S.paid=0;save();}}
function render(){
  var pend=S.debts.reduce(function(a,d){return a+d.left;},0);
  var gas=S.expenses.reduce(function(a,e){return a+e.amount;},0);
  var left=S.salary-pend-S.paid-gas;
  $("left").textContent=m(left);$("left").className="big "+(left<0?"neg":"pos");
  $("s1").textContent=m(S.salary);$("s2").textContent="− "+m(pend);$("s3").textContent="− "+m(S.paid);$("s4").textContent="− "+m(gas);
  $("s5").textContent=m(S.salary-pend-S.paid);
  $("salIn").value=S.salary||"";
  $("dL").innerHTML=S.debts.length?S.debts.map(function(d){return '<div class="d"><div class="row" style="border:0;padding:0"><b>'+esc(d.name)+'</b><span class="neg">'+m(d.left)+'</span></div><div class="mut">Deuda inicial: '+m(d.total)+'</div><div class="f"><input id="p'+d.id+'" type="number" inputmode="decimal" placeholder="Pagar (vacío = todo)"><button onclick="payDebt(\''+d.id+'\')">Pagar</button><button class="g" style="flex:0 0 auto" onclick="delDebt(\''+d.id+'\')">✕</button></div></div>';}).join(""):'<div class="mut">No tienes deudas pendientes.</div>';
  $("gL").innerHTML=S.expenses.length?S.expenses.map(function(e){return '<div class="row"><span>'+esc(e.desc)+'<div class="mut">'+esc(e.cat)+'</div></span><span>'+m(e.amount)+' <button class="g" style="padding:4px 8px" onclick="delExp(\''+e.id+'\')">✕</button></span></div>';}).join(""):'<div class="mut">Aún no hay gastos.</div>';
}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b);});
  ["sal","deu","gas"].forEach(function(t){$(t).hidden=t!==b.dataset.t;});
};});
render();
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js");}}catch(e){}
</script>
</body>
</html>
